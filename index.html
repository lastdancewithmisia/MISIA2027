  .dh {

  .dh:last-child { border-right: none; }
  .dh.sat { color: #ffd9a0; }
  .dh.sun { color: #ff8888; }

  /* ═══ Date Cells - UNIFORM 95px height ═══ */
  .dc {
    height: 12vw; min-height: 58px; max-height: 95px;
    overflow: visible;
    position: relative;
    padding: 6px 5px 5px;

    flex-direction: column;

  .dc.fil {

  .dc.emp {

<body>
<canvas id="bgcv" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>

<div class="page">
  <div class="brand">
    <div class="brand-mark">
      <span class="brand-starts">STARTS</span>

    </div>
    <div class="brand-misia">MISIA</div>
    <div class="brand-sub1">BIG BAND ORCHESTRA</div>
    <a class="brand-sub2" href="https://www.misia.jp/news/17845" target="_blank" rel="noopener">2027 BEYOND FREEDOM</a>
  </div>

  <div id="root"></div>
</div>

<script>
// ===== ゴールドスポットライト・ステージ背景（星空の代わり） =====
var BG_IMAGE = '';
(function(){
  var cv=document.getElementById('bgcv'), cx=cv.getContext('2d');
  var seed=42; function rnd(){seed=(seed*1664525+1013904223)&0xffffffff;return(seed>>>0)/4294967296;}

  function draw(){
    cv.width=window.innerWidth; cv.height=window.innerHeight;

    if(BG_IMAGE){
      var img=new Image();
      img.onload=function(){cx.drawImage(img,0,0,cv.width,cv.height);};
      img.src=BG_IMAGE; return;
    }

    // ── ベース：深いワインブラウン〜漆黒のグラデーション（重厚な幕） ──
    var bg=cx.createLinearGradient(0,0,0,cv.height);
    bg.addColorStop(0.00,'#0a0605');
    bg.addColorStop(0.32,'#170a08');
    bg.addColorStop(0.62,'#1f0f0a');
    bg.addColorStop(1.00,'#0c0605');
    cx.fillStyle=bg; cx.fillRect(0,0,cv.width,cv.height);

    // ── ボケた舞台照明（ピントの合っていない大きな光の玉）を数個配置 ──
    // 派手な光線やきらめきではなく、上質なコンサート写真のような滲んだ光で演出
    seed=7;
    var bokeh=[
      {cx:.18, cy:.10, r:.22, col:'231,198,117', a:.20},
      {cx:.82, cy:.06, r:.26, col:'196,140,70',  a:.16},
      {cx:.50, cy:-.05, r:.34, col:'231,198,117', a:.22},
      {cx:.08, cy:.55, r:.16, col:'150,90,50',   a:.10},
      {cx:.92, cy:.62, r:.18, col:'160,100,55',  a:.10},
      {cx:.35, cy:.88, r:.20, col:'120,70,45',   a:.09},
      {cx:.68, cy:.92, r:.15, col:'150,95,55',   a:.08}
    ];
    bokeh.forEach(function(b){
      var x=cv.width*b.cx, y=cv.height*b.cy, r=cv.width*b.r;
      var g=cx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba('+b.col+','+b.a+')');
      g.addColorStop(.6,'rgba('+b.col+','+(b.a*.35)+')');
      g.addColorStop(1,'transparent');
      cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2); cx.fill();
    });

    // ── 四隅を落として中央に視線を集めるヴィネット ──
    var vg=cx.createRadialGradient(cv.width*.5,cv.height*.42,cv.height*.22,cv.width*.5,cv.height*.42,cv.width*.72);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,.5)');
    cx.fillStyle=vg; cx.fillRect(0,0,cv.width,cv.height);

    // ── ごく微細な粒状感（フィルム写真のような質感） ──
    seed=101;
    for(var i=0;i<400;i++){
      var x=rnd()*cv.width, y=rnd()*cv.height;
      cx.fillStyle='rgba(255,240,220,'+(rnd()*0.025)+')';
      cx.fillRect(x,y,1,1);
    }
  }
  draw(); window.addEventListener('resize',draw);
})();

const MONTHS = [
  {
    name: '1月', fw: 4, days: 31,
    ev: {
      30: { v: ['福岡・マリンメッセ福岡A館'], t: 'OPEN/START 未定' },
      31: { v: ['福岡・マリンメッセ福岡A館'], t: 'OPEN/START 未定' }
    },
    hol: [1, 2, 3]
  },
  {
    name: '2月', fw: 0, days: 28,
    ev: {
      6:  { v: ['神奈川・横浜アリーナ'], t: 'OPEN/START 未定' },
      7:  { v: ['神奈川・横浜アリーナ'], t: 'OPEN/START 未定' },
      20: { v: ['兵庫・GLION ARENA KOBE'], t: 'OPEN/START 未定' },
      21: { v: ['兵庫・GLION ARENA KOBE'], t: 'OPEN/START 未定' },
      27: { v: ['岩手・盛岡タカヤアリーナ'], t: 'OPEN/START 未定' }
    },
    hol: [11, 23]
  },
  {
    name: '3月', fw: 0, days: 31,
    ev: {
      3:  { v: ['愛知・クロコくんホール', '（日本ガイシホール）'], t: 'OPEN/START 未定' },
      4:  { v: ['愛知・クロコくんホール', '（日本ガイシホール）'], t: 'OPEN/START 未定' },
      13: { v: ['大阪・大阪城ホール'], t: 'OPEN/START 未定' },
      14: { v: ['大阪・大阪城ホール'], t: 'OPEN/START 未定' },
      27: { v: ['香川・あなぶきアリーナ香川'], t: 'OPEN/START 未定' },
      28: { v: ['香川・あなぶきアリーナ香川'], t: 'OPEN/START 未定' }
    },
    hol: [21]
  },
  {
    name: '4月', fw: 3, days: 30,
    ev: {
      3:  { v: ['東京・有明アリーナ'], t: 'OPEN/START 未定' },
      4:  { v: ['東京・有明アリーナ'], t: 'OPEN/START 未定' },
      10: { v: ['沖縄・沖縄サントリーアリーナ'], t: 'OPEN/START 未定' },
      11: { v: ['沖縄・沖縄サントリーアリーナ'], t: 'OPEN/START 未定' },
      17: { v: ['広島・広島グリーンアリーナ'], t: 'OPEN/START 未定' },
      18: { v: ['広島・広島グリーンアリーナ'], t: 'OPEN/START 未定' },
      22: { v: ['大阪・大阪城ホール'], t: 'OPEN/START 未定' },
      23: { v: ['大阪・大阪城ホール'], t: 'OPEN/START 未定' }
    },
    hol: [29]
  },
  {
    name: '5月', fw: 5, days: 31,
    ev: {
      1: { v: ['北海道・真駒内', 'セキスイハイムアイスアリーナ'], t: 'OPEN/START 未定' },
      2: { v: ['北海道・真駒内', 'セキスイハイムアイスアリーナ'], t: 'OPEN/START 未定' }
    },
    hol: [3, 4, 5]
  }
];

function buildMonth(m) {
  const wrap = document.createElement('div');
  wrap.className = 'mwrap';

  const lbl = document.createElement('div');
  lbl.className = 'mlbl';
  lbl.textContent = m.name;
  wrap.appendChild(lbl);

  const grid = document.createElement('div');
  grid.className = 'cgrid';

  ['月', '火', '水', '木', '金', '土', '日'].forEach((d, i) => {
    const th = document.createElement('div');
    th.className = 'dh' + (i === 5 ? ' sat' : i === 6 ? ' sun' : '');
    th.textContent = d;
    grid.appendChild(th);
  });

  const off = m.fw;
  const hset = new Set(m.hol);

  const totalCells = 42;

  for (let i = 0; i < totalCells; i++) {
    const day = i - off + 1;
    const col = i % 7;
    const dc = document.createElement('div');

    if (i < off || day > m.days) {
      dc.className = 'dc emp';
      grid.appendChild(dc);
      continue;
    }

    const isSat = col === 5;
    const isSun = col === 6;
    const isHol = hset.has(day);
    const e = m.ev[day];

    let cls = 'dc fil';
    if (isSat) cls += ' sat';
    if (isSun) cls += ' sun';
    if (isHol) cls += ' hol';
    if (e) cls += ' evt';
    dc.className = cls;

    const dn = document.createElement('div');
    dn.className = 'dn';
    dn.textContent = day;
    dc.appendChild(dn);

    if (e) {
      const ev = document.createElement('div');
      ev.className = 'ev';
      e.v.forEach(line => {
        const p = document.createElement('div');
        p.className = 'vn';
        p.textContent = line;
        ev.appendChild(p);
      });
      const t = document.createElement('div');
      t.className = 'tm';
      t.textContent = e.t;
      ev.appendChild(t);
      dc.appendChild(ev);
    }

    grid.appendChild(dc);
  }

  wrap.appendChild(grid);
  return wrap;
}

const root = document.getElementById('root');

[[0],[1],[2],[3],[4]].forEach(pair => {
  const row = document.createElement('div');
  row.className = 'row';
  pair.forEach(i => row.appendChild(buildMonth(MONTHS[i])));
  if (pair.length === 1) row.appendChild(document.createElement('div'));
  root.appendChild(row);
});
</script>
