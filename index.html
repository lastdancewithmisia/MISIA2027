<style>
  :root {
    --bg:        #f2d0dc;
    --mg:        #e8007a;   /* マゼンタ */
    --rg:        #c080a0;   /* グレーピンク */
    --cyan:      #009bbd;
    --white:     #ffffff;
    --cell-bd:   rgba(180,0,90,0.18);
    --dh-top:    #d83878;
    --dh-bot:    #a00050;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { color-scheme: light; }
  body {
    background: var(--bg) !important;
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: auto;
    color-scheme: light;
  }
  .page { width:100%; padding:0 10px 40px; }

  /* ─── Header ─── */
  .header { text-align:center; padding:clamp(16px,3vw,32px) 16px clamp(8px,1.5vw,16px); }

  /* MISIA: M=mg I=rg S=mg I=rg A=mg */
  .misia-wrap {
    display:flex; justify-content:center; align-items:flex-end;
    line-height:0.88; margin-bottom:clamp(2px,0.5vw,5px);
  }
  .mc { font-family:'Bebas Neue',sans-serif; font-size:clamp(58px,14vw,142px); font-weight:900; display:inline-block; }
  .mg { color:var(--mg); }
  .rg { color:var(--rg); }

  /* BIG=rg BAND=mg ORCHESTRA=rg 2027=rg */
  .bbo-block { margin-bottom:clamp(1px,0.4vw,4px); }
  .bbo-line { display:flex; align-items:baseline; justify-content:center; gap:0; flex-wrap:wrap; }
  .bbt { font-family:'Bebas Neue',sans-serif; font-size:clamp(13px,2.8vw,32px); letter-spacing:2px; display:inline; }

  /* BEYOND: B=rg E=mg Y=rg O=mg N=rg D=mg */
  .beyond-wrap { display:flex; justify-content:center; align-items:flex-end; line-height:0.92; margin-bottom:clamp(0px,0.3vw,3px); }
  .byt { font-family:'Bebas Neue',sans-serif; font-size:clamp(30px,7vw,72px); letter-spacing:2px; display:inline-block; }

  /* FREEDOM: F=mg R=rg E=mg E=rg D=mg O=rg M=mg */
  .freedom-wrap { display:flex; justify-content:center; align-items:flex-end; line-height:0.9; }
  .frt { font-family:'Bebas Neue',sans-serif; font-size:clamp(44px,11vw,112px); letter-spacing:2px; display:inline-block; }

  .header-divider {
    width:80%; max-width:480px; height:3px;
    background:linear-gradient(90deg,transparent,var(--mg),transparent);
    margin:clamp(8px,2vw,18px) auto; border-radius:2px;
  }

  /* ─── Calendar ─── */
  .row { display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:14px; }
  .mlbl {
    font-family:'Bebas Neue',sans-serif; color:var(--mg);
    font-size:clamp(22px,5vw,40px); font-weight:900;
    letter-spacing:5px; margin-bottom:6px; padding-left:4px;
  }
  .cgrid {
    display:grid; grid-template-columns:repeat(7,1fr);
    overflow:hidden;
  }


  .dh {
    background:linear-gradient(180deg,var(--dh-top) 0%,var(--dh-bot) 100%);
    color:var(--white); font-size:clamp(11px,1.9vw,15px); font-weight:900;
    text-align:center; padding:8px 0; letter-spacing:2px;
    border-right:1px solid rgba(255,255,255,0.22);
    border-bottom:2px solid rgba(255,255,255,0.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.22);
  }
  .dh:last-child { border-right:none; }
  .dh.sat,.dh.sun { background:linear-gradient(180deg,#c03878 0%,#80204a 100%); color:#ffd0e8; }

  .dc {
    height:100%; overflow:visible; padding:5px 4px 3px; box-sizing:border-box;
    display:flex; flex-direction:column; align-items:flex-start;
    background:transparent;
    border:none;
  }

  .dc.emp { background:transparent; border:none; }
  .week-line { border-top:1.5px solid rgba(150,0,75,0.5); }
  .dc.evt {
    background:linear-gradient(135deg,rgba(255,210,230,0.75) 0%,rgba(240,175,205,0.55) 45%,rgba(195,95,145,0.35) 100%);
    border:2px solid rgba(200,0,100,0.55);
    border-radius:6px;
    box-shadow:inset 2px 2px 6px rgba(255,230,240,0.6),inset -2px -2px 6px rgba(155,35,85,0.22),0 0 8px rgba(200,0,100,0.15);
  }


  /* 日付数字：平日イベントは黒、土日祝のみマゼンタ */
  .dn {
    font-size:clamp(13px,2.5vw,18px); font-weight:900;
    color:#1a0008;   /* 黒に近い色（デフォルト） */
    line-height:1; margin-bottom:1px;
    font-family:'Bebas Neue','Noto Sans JP',sans-serif; letter-spacing:1px;
  }
  .dc.sat .dn,.dc.sun .dn,.dc.hol .dn { color:var(--mg) !important; }
  /* イベントセルでも平日は黒のまま（土日祝だけマゼンタ） */
  .dc.evt .dn { color:#1a0008; }
  .dc.evt.sat .dn,.dc.evt.sun .dn,.dc.evt.hol .dn { color:var(--mg) !important; }

  .ev { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; flex:1; gap:1px; margin-top:1px; }
  .vn {
    width:100%; font-size:clamp(6.5px,1.2vw,9.5px); font-weight:700;
    color:#1a0008; text-align:center; white-space:nowrap; overflow:visible;
    line-height:1.35; letter-spacing:0.2px;
  }
  .tm {
    font-size:clamp(6px,1.1vw,9px); font-weight:900; color:var(--cyan);
    text-align:center; white-space:normal; word-break:keep-all;
    letter-spacing:0.3px; margin-top:2px; line-height:1.25;
    width:100%; overflow:visible;
    font-family:'Bebas Neue','Noto Sans JP',sans-serif;
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">

    <!-- MISIA: M=mg I=rg S=mg I=rg A=mg -->
    <div class="misia-wrap">
      <span class="mc mg">M</span>
      <span class="mc rg">I</span>
      <span class="mc mg">S</span>
      <span class="mc rg">I</span>
      <span class="mc mg">A</span>
    </div>

    <!-- BIG=rg  BAND=mg  ORCHESTRA=rg  2027=rg -->
    <div class="bbo-block">
      <div class="bbo-line">
        <span class="bbt rg">BIG&nbsp;</span>
        <span class="bbt mg">BAND&nbsp;</span>
        <span class="bbt rg">ORCHESTRA&nbsp;</span>
        <span class="bbt rg">2027</span>
      </div>
    </div>

    <!-- BEYOND: B=rg E=mg Y=rg O=mg N=rg D=mg -->
    <div class="beyond-wrap">
      <span class="byt rg">B</span>
      <span class="byt mg">E</span>
      <span class="byt rg">Y</span>
      <span class="byt mg">O</span>
      <span class="byt rg">N</span>
      <span class="byt mg">D</span>
    </div>

    <!-- FREEDOM: F=mg R=rg E=mg E=rg D=mg O=rg M=mg -->
    <div class="freedom-wrap">
      <span class="frt mg">F</span>
      <span class="frt rg">R</span>
      <span class="frt mg">E</span>
      <span class="frt rg">E</span>
      <span class="frt mg">D</span>
      <span class="frt rg">O</span>
      <span class="frt mg">M</span>
    </div>

    <div class="header-divider"></div>
  </div>

  <div id="root"></div>
</div>

<script>
const MONTHS = [
  {
    name:'1月', fw:4, days:31,
    ev:{
      30:{v:['福岡・マリンメッセ福岡A館'],t:'開場16:00/開演17:00'},
      31:{v:['福岡・マリンメッセ福岡A館'],t:'開場15:00/開演16:00'}
    },
    hol:[1,11]
  },
  {
    name:'2月', fw:0, days:28,
    ev:{
      6: {v:['神奈川・横浜アリーナ'],t:'開場16:00/開演17:00'},
      7: {v:['神奈川・横浜アリーナ'],t:'開場15:00/開演16:00'},
      20:{v:['兵庫・GLION ARENA KOBE'],t:'開場16:00/開演17:00'},
      21:{v:['兵庫・GLION ARENA KOBE'],t:'開場15:00/開演16:00'},
      27:{v:['岩手・盛岡タカヤアリーナ'],t:'開場16:00/開演17:00'}
    },
    hol:[11,23]
  },
  {
    name:'3月', fw:0, days:31,
    ev:{
      3: {v:['愛知・クロコくんホール','（日本ガイシホール）'],t:'開場17:00/開演18:00'},
      4: {v:['愛知・クロコくんホール','（日本ガイシホール）'],t:'開場17:00/開演18:00'},
      13:{v:['大阪・大阪城ホール'],t:'開場16:00/開演17:00'},
      14:{v:['大阪・大阪城ホール'],t:'開場15:00/開演16:00'},
      27:{v:['香川・あなぶきアリーナ香川'],t:'開場16:00/開演17:00'},
      28:{v:['香川・あなぶきアリーナ香川'],t:'開場15:00/開演16:00'}
    },
    hol:[21,22]
  },
  {
    name:'4月', fw:3, days:30,
    ev:{
      3: {v:['東京・有明アリーナ'],t:'開場16:00/開演17:00'},
      4: {v:['東京・有明アリーナ'],t:'開場15:00/開演16:00'},
      10:{v:['沖縄・沖縄サントリーアリーナ'],t:'開場16:00/開演17:00'},
      11:{v:['沖縄・沖縄サントリーアリーナ'],t:'開場15:00/開演16:00'},
      17:{v:['広島・広島グリーンアリーナ'],t:'開場16:00/開演17:00'},
      18:{v:['広島・広島グリーンアリーナ'],t:'開場15:00/開演16:00'},
      22:{v:['大阪・大阪城ホール'],t:'開場17:00/開演18:00'},
      23:{v:['大阪・大阪城ホール'],t:'開場17:00/開演18:00'}
    },
    hol:[29]
  },
  {
    name:'5月', fw:5, days:31,
    ev:{
      1:{v:['北海道・真駒内','セキスイハイムアイスアリーナ'],t:'開場16:00/開演17:00'},
      2:{v:['北海道・真駒内','セキスイハイムアイスアリーナ'],t:'開場15:00/開演16:00'}
    },
    hol:[3,4,5]
  }
];

function buildMonth(m){
  const wrap=document.createElement('div');
  const lbl=document.createElement('div');
  lbl.className='mlbl'; lbl.textContent=m.name; wrap.appendChild(lbl);
  const grid=document.createElement('div'); grid.className='cgrid';
  ['月','火','水','木','金','土','日'].forEach((d,i)=>{
    const th=document.createElement('div');
    th.className='dh'+(i===5?' sat':i===6?' sun':'');
    th.textContent=d; grid.appendChild(th);
  });
  const hset=new Set(m.hol);
  // 実際に必要な週数だけ表示（空白行を作らない）
  const weeks = Math.ceil((m.fw + m.days) / 7);
  const rowH = window.innerWidth >= 600 ? '84px' : '15vw';
  grid.style.gridTemplateRows = 'auto repeat(' + weeks + ', ' + rowH + ')';
  const totalCells = weeks * 7;
  for(let i=0;i<totalCells;i++){
    const day=i-m.fw+1, col=i%7;
    const dc=document.createElement('div');
    const isWeekStart = (i >= 7); // 2週目以降の全セル＝週の区切り行
    if(i<m.fw||day>m.days){
      dc.className='dc emp'+(isWeekStart?' week-line':'');
      grid.appendChild(dc); continue;
    }
    const isSat=col===5, isSun=col===6, isHol=hset.has(day), e=m.ev[day];
    dc.className='dc'
      +(isSat?' sat':isSun?' sun':'')
      +(isHol?' hol':'')
      +(e?' evt':'')
      +(isWeekStart?' week-line':'');
    const dn=document.createElement('div');
    dn.className='dn'; dn.textContent=day; dc.appendChild(dn);
    if(e){
      const ev=document.createElement('div'); ev.className='ev';
      e.v.forEach(line=>{
        const p=document.createElement('div');
        p.className='vn'; p.textContent=line; ev.appendChild(p);
      });
      const t=document.createElement('div');
      t.className='tm'; t.textContent=e.t; ev.appendChild(t);
      dc.appendChild(ev);
    }
    grid.appendChild(dc);
  }
  wrap.appendChild(grid); return wrap;
}

window.addEventListener('resize', () => {
  document.querySelectorAll('.cgrid').forEach(grid => {
    const weeks = parseInt(grid.style.gridTemplateRows.match(/repeat\((\d+)/)?.[1] || 6);
    const rowH = window.innerWidth >= 600 ? '84px' : '15vw';
    grid.style.gridTemplateRows = 'auto repeat(' + weeks + ', ' + rowH + ')';
  });
});
const root=document.getElementById('root');
[[0],[1],[2],[3],[4]].forEach(pair=>{
  const row=document.createElement('div'); row.className='row';
  pair.forEach(i=>row.appendChild(buildMonth(MONTHS[i])));
  root.appendChild(row);
});
</script>
</body>
</html>
